# dsh-input-history bundle patch.
#
# Installing through the official CLI —
#
#   dsh plugin --profile web add /path/to/dsh-input-history
#
# — reconciles `dsh.profile.bundles`, sees this declaration, and appends
# `dsh-input-history` to the bundle stack; this patch inserts the host half's
# loader row. Keep the id stable: the client bundle id and the profile row
# id must stay in sync for HMR bookkeeping.
- insert:
    - id: input-history
      name: 'dsh-input-history'
